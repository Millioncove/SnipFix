<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Editor Timeline</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="UploadPage">
        <div class="upload-header">
            <h1>SnipFix Video Editor</h1>
            <p class="upload-subtitle">Simple video trimming in your browser</p>
        </div>
        
        <div class="upload-container">
            <div class="upload-icon">
                <i class="fa fa-cloud-upload fa-4x"></i>
            </div>
        
            <p class="upload-text">Upload your video to get started</p>
        
            <input type="file" id="Upload" accept="video/*" style="display: none;">
            <button id="UploadButton" onclick="document.getElementById('Upload').click();">
                <i class="fa fa-file-video-o"></i> Browse Files
            </button>
            <div class="processing-indicator processing-indicator-container">
                <h2 class="processing-indicator processing-status">Editor ready!</h2>
                <i class="processing-indicator process-spinner fa fa-cog fa-spin fa-3x"></i>
            </div>
            <p class="upload-hint">Supported formats: MP4, WebM, MOV, AVI</p>
            </div>
            
            <div class="feature-list">
                <div class="feature-item">
                    <i class="fa fa-scissors"></i>
                    <span>Trim videos</span>
                </div>
                <div class="feature-item">
                    <i class="fa fa-volume-up"></i>
                    <span>Adjust audio</span>
                </div>
                <div class="feature-item">
                    <i class="fa fa-download"></i>
                    <span>Easy export</span>
                </div>
            </div>
    </div>
    
    <div id="FileGallery">
        <div id="FileGalleryContainer">
    
            <template id="gallery-entry-template">
                <div id="EntryContainer">
    
                    <link rel="stylesheet" href="gallery-entry-style.css">
                    <link rel="stylesheet"
                        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    
                    <i id="FileIcon" class="fa fa-file-image-o"></i>
                    
                    <h1 id="EntryTitle">File name!</h1>
                    <div id="FileEntry">
                        <div id="FileInfo">
                            <p id="FileSize">File size!</p>
                            <p id="FileName">File name!</p>
                        </div>
                        <div id="ButtonContainer">
                            <a id="DownloadButton">Download<i class="fa fa-download"></i></a>
                            <button id="DeleteButton">Delete<i class="fa fa-times"></i></button>
                        </div>
                    </div>
    
                </div>
            </template>
        </div>
    
    </div>
    <div id="SnipFixEditor">
    
        <div id="VideoContainer">
            <video id="video" playsinline class="play-pause">
                <source type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    
        <div id="ControlsContainer">
            <div class="flex-margin">
                <div class="controls-left">
                    <div class="processing-status-wrapper">
                        <h2 class="processing-status processing-indicator">Editor ready!</h2>
                        <i class="processing-indicator process-spinner fa fa-cog fa-spin fa-2x"></i>
                        </div>
                </div>
                </div>
                <div class="controls-center">
                    <button id="EditButton" disabled class="video-processing-starter">
                        <i class="fa fa-scissors"></i> Trim Video
                    </button>
                <p id="Hint">Hint: You can already download the uncompressed version!</p>
            </div>
            
            <div class="flex-margin">
                <div class="controls-right">
                    <div class="time-display">
                        <span id="currentTime">00:00</span> / <span id="totalTime">00:00</span>
                    </div>
                </div>
            </div>
        </div>
    
        <div id="TracksContainer">
            <div id="TracksTimeline">
                <datalist id="KeyFrameTimes">
                </datalist>

                <input type="range" id="Playhead" class="timeline-slider">
                <input type="range" id="TimelineStartBound" class="timeline-slider bound" list="KeyFrameTimes">
                <input type="range" id="TimelineEndBound" class="timeline-slider bound" list="KeyFrameTimes">

                <template id="media-track-template">
                    <link rel="stylesheet" href="media-track-style.css">
                    <div id="Track">
                        <h1 id="TrackName">Track name!</h1>
                        <div id="Clip">
                            <input type="range" orient="vertical" id="Volume" min="0" max="100">
                        </div>
                    </div>
                    <audio id="audio"></audio>
                </template>
            </div>
        </div>
    </div>
</body>
<script src="coi-serviceworker.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.10.1/dist/ffmpeg.min.js"></script>
<script type="module" src="script.js"></script>

</html>
